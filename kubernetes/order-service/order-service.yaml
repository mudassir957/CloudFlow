apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: cloudflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: mudassircloudflow123.azurecr.io/cloudflow-order-service:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: order-config
            - secretRef:
                name: database-secret

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: cloudflow
spec:
  selector:
    app: order-service
  ports:
    - port: 3001
      targetPort: 3001