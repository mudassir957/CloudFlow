apiVersion: v1
kind: Pod
metadata:
  name: cpu-load-generator
  namespace: cloudflow
spec:
  containers:
    - name: load-generator
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - |
          while true; do
            wget -q -O- http://api-gateway:3002/orders/1 || true
          done