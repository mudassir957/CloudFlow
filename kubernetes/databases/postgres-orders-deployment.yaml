apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-orders
  namespace: cloudflow
spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgres-orders

  template:
    metadata:
      labels:
        app: postgres-orders

    spec:
      containers:
        - name: postgres
          image: postgres:16

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_DB
              value: cloudflow_orders

            - name: POSTGRES_USER
              value: cloudflow

            - name: POSTGRES_PASSWORD
              value: password

          volumeMounts:
            - name: postgres-orders-storage
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: postgres-orders-storage
          persistentVolumeClaim:
            claimName: postgres-orders-pvc