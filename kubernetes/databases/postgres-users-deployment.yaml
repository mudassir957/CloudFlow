apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-users
  namespace: cloudflow
spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgres-users

  template:
    metadata:
      labels:
        app: postgres-users

    spec:
      containers:
        - name: postgres
          image: postgres:16

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_DB
              value: cloudflow_users

            - name: POSTGRES_USER
              value: cloudflow

            - name: POSTGRES_PASSWORD
              value: password

          volumeMounts:
            - name: postgres-users-storage
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: postgres-users-storage
          persistentVolumeClaim:
            claimName: postgres-users-pvc