apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: cloudflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: cloudflow-user-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: user-config
            - secretRef:
                name: database-secret
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: cloudflow
spec:
  selector:
    app: user-service
  ports:
    - port: 3000
      targetPort: 3000